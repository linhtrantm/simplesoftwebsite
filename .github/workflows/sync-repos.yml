name: Sync portfolio repos

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build repos.json
        run: node scripts/sync-repos.mjs
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_TOKEN }}
          GH_USER: linhtrantm
          TOPIC: portfolio
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain repos.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add repos.json
            git commit -m "chore: sync portfolio repos"
            git push
          fi
